# build requirements
[build-system]
# torch is needed only to compile the legacy nanomoe_ops extension
# (MEGABLOCKS_BUILD_EXTENSIONS=1); supply it to the build environment then.
requires = ["setuptools >= 77, < 79"]
build-backend = "setuptools.build_meta"

[project]
name = "megablocks"
dynamic = ["version"]
description = "GPU kernels for variable-width mixture-of-experts inference and training"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Trevor Gale", email = "tgale@stanford.edu"},
]
maintainers = [
    {name = "Henry Freed", email = "hbfreed@protonmail.com"},
]
dependencies = [
    "torch>=2.11.0,<2.13",
]

[project.urls]
Homepage = "https://github.com/hbfreed/megablocks-variable"
Repository = "https://github.com/hbfreed/megablocks-variable.git"
Issues = "https://github.com/hbfreed/megablocks-variable/issues"
Upstream = "https://github.com/databricks/megablocks"

[project.optional-dependencies]
# megablocks.ops and megablocks.layers.relu_squared (the block-sparse path).
stk = [
    "stanford-stk==0.7.1",
]
cute = [
    "nvidia-cutlass-dsl>=4.6.0,<4.7",
    "apache-tvm-ffi>=0.1.0,<0.2",
]
dev = [
    "stanford-stk==0.7.1",
    "einops",
    "numpy>=1.21.5,<2.1.0",
    "coverage[toml]==7.4.4",
    "pytest-cov>=4,<5",
    "pytest>=7.2.1,<8",
    "pre-commit>=3.4.0,<4",
]
all = [
    "stanford-stk==0.7.1",
    "nvidia-cutlass-dsl>=4.6.0,<4.7",
    "apache-tvm-ffi>=0.1.0,<0.2",
    "einops",
    "numpy>=1.21.5,<2.1.0",
    "coverage[toml]==7.4.4",
    "pytest-cov>=4,<5",
    "pytest>=7.2.1,<8",
    "pre-commit>=3.4.0,<4",
]

[tool.setuptools.dynamic]
version = {attr = "megablocks._version.__version__"}

# Pytest
[tool.pytest.ini_options]
# By default, raise typos in fixtures as errors, have a short traceback, skip
# gpu tests, and display in color. Do not add --codeblocks: it executes every
# shell block in the Markdown files, which clone the repository, sync
# environments, and install git hooks.
addopts = "--strict-markers --tb=short -m 'not gpu' --color=yes"
testpaths = ["tests"]
pythonpath = [
  "."
]

markers = [
    # whether the test requires a gpu
    "gpu",
]

filterwarnings = [
    'ignore:Deterministic mode is activated:UserWarning',  # all tests run with deterministic mode
]

# Coverage
[tool.coverage.run]
parallel = true
branch = true
relative_files = true
concurrency = ["thread"]
include = [
    "megablocks/*"
]


# Ruff global
[tool.ruff]

preview = true # enable preview features, see https://docs.astral.sh/ruff/preview/

exclude = [
    ".claude/**",
    "build/**",
    "docs/**",
    "node_modules/**",
]

# Ruff linter
[tool.ruff.lint]
select = [
    "C4", # flake8-comprehensions
    # TODO port pydocstyle
    # "D", # pydocstyle
    "LOG", # flake8-logging
    "PERF", # Perflint
    "PLE",
    "COM812", # missing-trailing-comma
]

# Pyright
[tool.pyright]
exclude = ['env-**', 'venv*', '.venv', 'tests/*', '**benchmark']
stubPath = ""  # suppress useless 'stubPath is not a valid directory' errors

reportUnnecessaryIsInstance = "none" # it is ok to do this for clarity or safety
reportMissingTypeStubs = "none"
reportIncompatibleMethodOverride = "none"
reportIncompatibleVariableOverride = "error"
reportUnusedImport = "error"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportUntypedFunctionDecorator = "warning"
reportPrivateImportUsage = "none"
reportUndefinedVariable = "error"
strictParameterNoneValue = true
reportPropertyTypeMismatch = "error"
reportUntypedNamedTuple = "error"
reportUnnecessaryCast = "error"
reportInvalidTypeVarUse = "error"
reportOverlappingOverload = "error"
reportUninitializedInstanceVariable = "error"
reportInvalidStringEscapeSequence = "error"
reportMissingParameterType = "error"
reportCallInDefaultInitializer = "error"
reportUnnecessaryComparison = "error"
reportSelfClsParameterName = "error"
reportImplicitStringConcatenation = "warning"  # TODO: make this an error
reportInvalidStubStatement = "error"
reportIncompleteStub = "error"
reportUnsupportedDunderAll = "error"
reportUnusedCoroutine = "error"
reportMissingImports = "none"
